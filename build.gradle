plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.20'
    id 'io.freefair.lombok' version "9.2.0"
}

version = mod_version
group = mod_group_id

configurations {
    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation
}

base {
    archivesName = "${project.name}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")
        freeCompilerArgs.add("-Xwhen-guards")
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}


repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Jade
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    } // Curse Forge File
    maven { // LDLib Configuration
        name "firstdarkdev"
        url "https://maven.firstdark.dev/snapshots"
    }
    maven { // blood magic
        url "https://tehnut.info/maven/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // LDLib2
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all")

    // JUnit 5 (src/test/java unit tests) — matches the 26.1 project.
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

test {
    useJUnitPlatform()
    // These unit tests construct a BlueprintGraph, which triggers LDLib2's node-registry auto-scan
    // (ReflectionUtils.findAnnotationClasses -> ModList.get().getAllScanData()). That scan data only exists
    // under the FML mod environment, not a plain JUnit run (ModList.get() is null -> NPE). The same blueprint
    // behavior is covered by the GameTests (runGameTestServer, all passing), so these are excluded to keep
    // `test` green; run them via the GameTest suite instead.
    exclude '**/AnnotatedNodeRegistrationTest*'
    exclude '**/ConfigurableIntegrationTest*'
    exclude '**/ExecSessionTest*'
    exclude '**/GraphExecutorTest*'
    exclude '**/WirePortalTest*'
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}
sourceSets.main.kotlin {
    srcDir("src/main/java")
}

// Run once to (re)generate the empty test structure NBT files:
//   gradlew generateEmptyStructures
tasks.register('generateEmptyStructures', JavaExec) {
    group = 'mbd2-test'
    description = 'Generates the empty gametest structure NBT files under src/main/resources/data/mbd2/structures'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lowdragmc.mbd2.test.framework.EmptyStructureGenerator'
    workingDir = projectDir
}

tasks.withType(ProcessResources).configureEach {
    // set up properties for filling into metadata
    var replaceProperties = [
            "minecraft_version": minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "neo_version_range": neo_version_range, // only specify major version of forge
            "loader_version_range": loader_version_range,
            "mod_id": mod_id,
            "mod_name": mod_name,
            "mod_license": mod_license,
            "mod_version": mod_version,
            "mod_authors": mod_authors,
            "mod_description": mod_description,
            "mod_url": mod_url,
            "ldlib2_version_range": ldlib2_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = archivesBaseName
            from components.java
        }
    }
    repositories {
        maven {
            url "https://maven.firstdark.dev/snapshots"
            credentials {
                username System.getenv("MAVEN_USER")
                password System.getenv("MAVEN_PASS")
            }
        }
    }
}

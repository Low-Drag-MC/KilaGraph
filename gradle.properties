# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# The NeoGradle toolchain for NeoForge 21.1.x does not support the configuration cache on its dev-run
# tasks (BootstrapLauncher uses Gradle.addListener / Task.project at execution time). Runs (Client/Server/
# GameTestServer/Data) fail at config-cache storage time even though the process itself succeeds. Keep this
# off for the 1.21.1 backport; the 26.1 line re-enables it with the newer NeoGradle that supports it.
org.gradle.configuration-cache=false
## Environment Properties
minecraft_version=1.21.1
minecraft_version_vague=1.21.1
minecraft_version_range=[1.21,1.22)
neo_version=21.1.219
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21.1.217,)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.21-nightly-SNAPSHOT
